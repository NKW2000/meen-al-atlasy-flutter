name: Release

# كل وسم بصيغة v* بيبني النسختين وبينشرهن كـ Release على GitHub.
# وسم فيه شرطة (مثلاً v0.7.0-alpha.1) بينشر كنسخة تجريبية (pre-release).
# كل دفعة على main بتشغّل الاختبارات والبناء بس (بدون نشر).
# بتقدر كمان تشغّله بإيدك من تبويب Actions.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log

      # الاختبار اللي فشل بيطلع كتعليق (annotation) على صفحة التشغيل —
      # بيبيّن بدون ما تفتح السجل الكامل.
      - name: Surface failing tests
        if: failure()
        run: |
          grep -E '\[E\]' test.log | sed 's/^/::error title=Failing test::/' || true
          {
            echo '## Failing tests'
            echo '```'
            grep -A60 -E '\[E\]' test.log | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # مفتاح التوقيع الثابت من أسرار المستودع (Settings → Secrets → Actions):
      #   ANDROID_KEYSTORE_BASE64  — ملف .jks مشفّر base64
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS        — (افتراضي meen)
      # بدونهم البناء بيوقّع بمفتاح debug — وما بيتركّب فوق نسخة موقّعة
      # بمفتاح تاني.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets — signing with a throwaway debug key (updates won't install over previous builds)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-meen}"
          } > android/key.properties
          echo "Signing with the release key."

      # نكهتين (android/app/build.gradle.kts): اللعبة، والديمو بمعرّف
      # مختلف حتى يتركّب جنبها.
      - name: Build the game APK
        run: flutter build apk --release --flavor game

      - name: Build the demo APK
        run: flutter build apk --release --flavor demo --dart-define=DEMO=true

      - name: Name the artifacts after the tag
        id: names
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -z "$version" ] && version="$(date +%Y%m%d-%H%M)"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-game-release.apk \
            "artifacts/meen-al-atlasy-$version.apk"
          cp build/app/outputs/flutter-apk/app-demo-release.apk \
            "artifacts/meen-al-atlasy-$version-demo.apk"
          # نسخ بأسماء ثابتة — الموقع بيوصّل عليهن عبر releases/latest/download/…
          cp "artifacts/meen-al-atlasy-$version.apk" artifacts/meen-al-atlasy.apk
          cp "artifacts/meen-al-atlasy-$version-demo.apk" artifacts/meen-al-atlasy-demo.apk
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keep the APKs on the run
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.names.outputs.version }}
          path: artifacts/*.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            نسختين بهاد الإصدار:

            - `meen-al-atlasy-${{ steps.names.outputs.version }}.apk` — اللعبة. ركّبها على جهاز المضيف وعلى جهاز كل لاعب.
            - `meen-al-atlasy-${{ steps.names.outputs.version }}-demo.apk` — الديمو: معرض الشاشات بجهاز واحد، بدون شبكة. بتنركّب جنب اللعبة.

            > الـ APK موقّع بمفتاح تجربة، فأول تركيب بدّه تسمح بـ«مصادر غير معروفة».

  # iOS: البناء بدون توقيع بس — النشر على TestFlight بدّه حساب أبل
  # (خارج نطاق هالإصدار)، فالمهمة مكتوبة ومعطّلة.
  ios:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign
