name: meen_al_atlasy
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
  fonts:
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/baloo_bhaijaan2_medium.ttf
          weight: 500
        - asset: assets/fonts/baloo_bhaijaan2_bold.ttf
          weight: 700
        - asset: assets/fonts/baloo_bhaijaan2_extrabold.ttf
          weight: 800
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal_medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal_bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal_extrabold.ttf
          weight: 800
